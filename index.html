<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ritika's Game Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@300;400;700;900&display=swap" rel="stylesheet"/>
<style>
  /* ─── RESET & BASE STYLES ─── */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Roboto Slab', serif;
    color: #ffffff;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding-left: 10%; 
    overflow: hidden;
  }

  /* ─── VIDEO BACKGROUND ─── */
  .video-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }

  /* ─── DARK OVERLAY ─── */
  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(to right, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.4) 100%);
    z-index: -1;
  }

  /* ─── MAIN CONTENT CONTAINER ─── */
  .content {
    text-align: left;
    z-index: 1;
    max-width: 600px;
    animation: fadeIn 1s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ─── TYPOGRAPHY ─── */
  h1 {
    font-size: clamp(3rem, 8vw, 5rem);
    font-weight: 900;
    margin-bottom: 10px;
    text-shadow: 0 4px 10px rgba(0,0,0,0.5);
  }

  .subtitle {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-weight: 300;
    color: #e0e0e0;
    margin-bottom: 30px;
    line-height: 1.6;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  /* ─── TYPEWRITER EFFECT ─── */
  .typewriter-box {
    font-size: clamp(1.2rem, 3vw, 1.8rem);
    font-weight: 700;
    color: #00f0ff;
    background: rgba(0, 0, 0, 0.6);
    padding: 10px 20px;
    border-left: 4px solid #00f0ff;
    display: inline-block;
    margin-bottom: 40px;
  }

  .static-text {
    color: #ffffff;
    font-weight: 400;
  }

  .cursor {
    animation: blink 0.8s infinite;
    color: #00f0ff;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ─── RIGHT NAVIGATION BAR ─── */
  .nav-bar {
    position: absolute;
    right: 5%;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 15px; /* Slightly reduced gap to fit the sub-menu */
    z-index: 100;
  }

  .btn {
    text-decoration: none;
    color: #ffffff;
    font-family: 'Roboto Slab', serif;
    font-size: 1rem;
    font-weight: 700;
    padding: 15px 30px;
    background: rgba(0, 0, 0, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-right: 4px solid transparent; 
    transition: all 0.3s ease;
    text-align: right;
    cursor: pointer;
    width: 100%;
    display: block;
  }

  .btn:hover {
    background: rgba(0, 240, 255, 0.1);
    color: #00f0ff;
    border-color: rgba(0, 240, 255, 0.5);
    border-right: 4px solid #00f0ff; 
    transform: translateX(-5px);
  }

  /* Special styling for the 'Coming Soon' button */
  .btn-special {
    color: #8b8b9e;
    border-color: rgba(255,255,255,0.1);
  }
  .btn-special:hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(255, 255, 255, 0.3);
    border-right: 4px solid #fff;
  }

  /* ─── DROPDOWN SUBMENU FOR NUMBER GUESS ─── */
  .sub-menu {
    display: none; /* Hidden by default */
    flex-direction: column;
    gap: 5px;
    margin-top: -10px; /* Pulls it closer to the main button */
    padding-right: 20px; /* Indents it slightly from the right edge */
  }

  /* Class to show the submenu */
  .sub-menu.show {
    display: flex;
    animation: slideDown 0.3s ease forwards;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .sub-btn {
    text-decoration: none;
    color: #e0e0e0;
    font-family: 'Roboto Slab', serif;
    font-size: 0.85rem;
    font-weight: 400;
    padding: 8px 15px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-right: 2px solid transparent;
    transition: all 0.2s ease;
    text-align: right;
  }

  .sub-btn:hover {
    background: rgba(0, 240, 255, 0.1);
    color: #00f0ff;
    border-color: rgba(0, 240, 255, 0.3);
    border-right: 2px solid #00f0ff;
  }

  /* ─── RESPONSIVE DESIGN (MOBILE) ─── */
  @media (max-width: 768px) {
    body {
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding-left: 20px;
      padding-right: 20px;
    }
    
    .overlay {
        background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.8) 100%);
    }

    .content {
      text-align: center;
      margin-bottom: 40px;
    }

    .nav-bar {
      position: relative;
      right: auto;
      top: auto;
      transform: none;
      flex-direction: column; /* Keep column so submenu makes sense */
      align-items: center;
      width: 100%;
    }

    .btn, .sub-btn {
      text-align: center;
      border-right: 1px solid rgba(255, 255, 255, 0.3);
      border-bottom: 4px solid transparent;
      width: 100%;
      max-width: 250px;
    }
    
    .btn:hover {
        border-right: 1px solid rgba(0, 240, 255, 0.5);
        border-bottom: 4px solid #00f0ff;
        transform: translateY(-5px);
    }

    .sub-menu {
      padding-right: 0;
      width: 100%;
      align-items: center;
      margin-top: 0;
    }
    .sub-btn {
      border-bottom: 2px solid transparent;
    }
    .sub-btn:hover {
      border-right: 1px solid rgba(0, 240, 255, 0.3);
      border-bottom: 2px solid #00f0ff;
      transform: translateY(-2px);
    }
  }
</style>
</head>
<body>

  <video autoplay muted loop playsinline class="video-bg">
    <source src="vi.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <div class="overlay"></div>

  <div class="content">
    <h1>Hey, I am Ritika</h1>
    <p class="subtitle">
      I am a Computer Science and Engineering student.<br>
      This is my game website for fun.
    </p>

    <div class="typewriter-box">
      <span class="static-text">Play </span>
      <span id="typewriter"></span><span class="cursor">|</span>
    </div>
  </div>

  <div class="nav-bar">
    
    <div>
      <button class="btn" onclick="toggleSubMenu('ng-menu')">Number Guess ▼</button>
      
      <div class="sub-menu" id="ng-menu">
        <a href="v1ofline.html" class="sub-btn">Version 1</a>
        <a href="v2ofline.html" class="sub-btn">Version 2</a>
      </div>
    </div>

    <a href="v3tic.html" class="btn">Tika-Tac-Toe</a>
    <a href="card.html" class="btn">Card Flip</a>
    
    <a href="new.html" class="btn btn-special">Coming More Game...</a>

  </div>

  <script>
    // --- DROPDOWN LOGIC ---
    function toggleSubMenu(menuId) {
      const menu = document.getElementById(menuId);
      menu.classList.toggle('show');
    }

    // --- TYPEWRITER EFFECT LOGIC ---
    const words = ["Number Guess", "Tika-Tac-Toe", "Card Flip"];
    let i = 0;
    let isDeleting = false; 
    let txt = '';
    const typeSpeed = 100;
    const deleteSpeed = 50;
    const pauseTime = 2000;

    function typeWriter() {
      const currentWord = words[i % words.length];

      if (isDeleting) {
        txt = currentWord.substring(0, txt.length - 1);
      } else {
        txt = currentWord.substring(0, txt.length + 1);
      }

      document.getElementById("typewriter").textContent = txt;

      let speed = isDeleting ? deleteSpeed : typeSpeed;

      if (!isDeleting && txt === currentWord) {
        speed = pauseTime;
        isDeleting = true;
      } else if (isDeleting && txt === '') {
        isDeleting = false;
        i++;
        speed = 500;
      }

      setTimeout(typeWriter, speed);
    }

    window.onload = () => {
      setTimeout(typeWriter, 500);
    };
  </script>
</body>
</html>
