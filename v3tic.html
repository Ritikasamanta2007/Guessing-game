<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tika-Tac-Toe | Project R.I.T.I.</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Space+Mono&display=swap" rel="stylesheet"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0a0a0f;
  color: #e8e8f0;
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* BG grid */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(124,110,245,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(124,110,245,0.04) 1px, transparent 1px);
  background-size: 44px 44px;
  pointer-events: none;
}

/* Orbs */
.orb {
  position: fixed; border-radius: 50%;
  filter: blur(90px); pointer-events: none;
}
.orb1 { width:380px; height:380px; background:rgba(34,211,160,0.08); top:-120px; left:-120px; }
.orb2 { width:300px; height:300px; background:rgba(239,68,68,0.06); bottom:-90px; right:-90px; }

/* ── TOP RIGHT CONTROLS (Home & Mute) ── */
.top-controls {
  position: fixed;
  top: 20px;
  right: 20px;
  display: flex;
  gap: 10px;
  z-index: 100;
}
.ctrl-btn {
  background: rgba(17, 17, 24, 0.8);
  border: 1px solid #1e1e2e;
  color: #55556a;
  font-family: 'Syne', sans-serif;
  font-size: 0.8rem;
  font-weight: 700;
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  backdrop-filter: blur(5px);
  transition: 0.2s;
}
.ctrl-btn:hover {
  border-color: #22d3a0;
  color: #22d3a0;
  background: rgba(34,211,160,0.1);
}

/* WRAPPER */
.wrap { position:relative; z-index:1; width:100%; max-width:400px; }

/* HEADER */
.header { text-align:center; margin-bottom:24px; }
.badge-tag {
  display:inline-block;
  font-family:'Space Mono',monospace;
  font-size:0.6rem; letter-spacing:0.3em; text-transform:uppercase;
  color:#22d3a0; border:1px solid rgba(34,211,160,0.35);
  padding:5px 14px; border-radius:20px; margin-bottom:14px;
  background: rgba(34,211,160,0.05);
}
h1 { font-size:clamp(2rem,8vw,2.8rem); font-weight:800; line-height:1.05; letter-spacing:-0.02em; }
h1 span { color:#22d3a0; }

/* CARD */
.card {
  background:#111118; border:1px solid #1e1e2e;
  border-radius:18px; padding:28px; position:relative; overflow:hidden;
}

/* Mode Toggle */
.mode-toggle { 
  display:flex; gap:8px; margin-bottom:20px; justify-content:center; flex-wrap: wrap;
}
.mode-btn { 
  flex: 1 1 30%; background:transparent; border:1px solid #1e1e2e; 
  color:#55556a; padding:10px 8px; border-radius:10px; 
  cursor:pointer; font-family:'Syne', sans-serif; 
  font-size:0.75rem; font-weight:700; transition:0.2s; 
}
.mode-btn.active { 
  background:rgba(34,211,160,0.1); border-color:#22d3a0; color:#22d3a0; 
}

/* Status / Turn Indicator */
.status-bar {
  text-align: center; font-size: 1rem; font-weight: 700; 
  padding: 12px; border-radius: 10px; margin-bottom: 20px;
  background: #1e1e2e; color: #fff; transition: 0.3s;
}
.turn-x { color: #22d3a0; box-shadow: 0 0 15px rgba(34,211,160,0.2); }
.turn-o { color: #ef4444; box-shadow: 0 0 15px rgba(239,68,68,0.2); }

/* TIC TAC TOE BOARD */
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.cell {
  background: #0a0a0f; border: 2px solid #1e1e2e;
  border-radius: 12px; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 3rem; font-weight: 800; font-family: 'Space Mono', monospace;
  cursor: pointer; transition: 0.2s;
}
.cell:hover:not(.taken) { border-color: #55556a; background: #15151f; }
.cell.x { color: #22d3a0; text-shadow: 0 0 15px rgba(34,211,160,0.5); }
.cell.o { color: #ef4444; text-shadow: 0 0 15px rgba(239,68,68,0.5); }
.cell.win { background: rgba(255,255,255,0.1); border-color: #fff; animation: pop 0.4s ease; }

@keyframes pop { 
  0% { transform: scale(1); } 
  50% { transform: scale(1.1); } 
  100% { transform: scale(1); } 
}

/* Restart Button */
.btn-pri {
  width: 100%; background:#22d3a0; border:none; color:#0a0a0f;
  border-radius:10px; padding:14px; font-family:'Syne',sans-serif;
  font-size:0.9rem; font-weight:800; cursor:pointer;
  transition:background 0.2s, transform 0.15s, box-shadow 0.2s;
}
.btn-pri:hover { background:#34e0af; transform:translateY(-2px); box-shadow:0 6px 20px rgba(34,211,160,0.35); }

/* Scoreboard */
.scores {
  display: flex; justify-content: space-between; margin-top: 20px;
  font-family: 'Space Mono', monospace; font-size: 0.8rem; color: #55556a;
}
.score-box { text-align: center; }
.score-box strong { display: block; font-size: 1.2rem; color: #e8e8f0; margin-top: 4px; }
.score-x { color: #22d3a0; }
.score-o { color: #ef4444; }

</style>
</head>
<body>

<div class="orb orb1"></div>
<div class="orb orb2"></div>

<!-- TOP RIGHT CONTROLS -->
<div class="top-controls">
  <button class="ctrl-btn" onclick="window.location.href='index.html'">🏠 Home</button>
  <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()">🔊 Mute</button>
</div>

<div class="wrap">
  <div class="header">
    <div class="badge-tag">🌸 Project R.I.T.I. 🌸</div>
    <h1>Tika-Tac<br><span>Toe</span></h1>
  </div>

  <div class="card">
    
    <!-- Mode Selector -->
    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-easy" onclick="setMode('easy')">👤 Easy</button>
      <button class="mode-btn" id="mode-imp" onclick="setMode('impossible')">🤖 Impossible</button>
      <button class="mode-btn" id="mode-2p" onclick="setMode('2p')">👥 2 Players</button>
    </div>

    <!-- Status Bar -->
    <div class="status-bar turn-x" id="status">Player X's Turn</div>

    <!-- Game Board -->
    <div class="board" id="board">
      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <!-- Restart Button -->
    <button class="btn-pri" onclick="resetGame()">Restart Game</button>

    <!-- Scoreboard -->
    <div class="scores">
      <div class="score-box score-x">Player X <strong id="score-x">0</strong></div>
      <div class="score-box">Draws <strong id="score-draw">0</strong></div>
      <div class="score-box score-o">Player O <strong id="score-o">0</strong></div>
    </div>

  </div>
</div>

<script>
// --- AUDIO STATE ---
let isMuted = false;

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('mute-btn').innerHTML = isMuted ? '🔇 Unmute' : '🔊 Mute';
}

// --- LOCAL AUDIO SETUP ---
// Action Audio
const customWinSound = new Audio('win.mp3');
const customDrawSound = new Audio('loss.mp3');
const customLoseSound = new Audio('no.mp3'); // Plays when CPU wins

// Mode Selection Audio
const easyModeSound = new Audio('e.mp3');
const impModeSound = new Audio('d.mp3');

// --- RETRO SYNTH AUDIO (For clicks and 2-player mode) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(frequency, type = 'sine', duration = 0.1) {
  if (isMuted) return; // Stop if muted
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  
  osc.type = type;
  osc.frequency.setValueAtTime(frequency, audioCtx.currentTime);
  
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
  
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function playSequence(notes) {
  notes.forEach((note, index) => {
    setTimeout(() => playTone(note.f, note.t, note.d), index * 150);
  });
}

// --- GAME STATE ---
let boardData = ["", "", "", "", "", "", "", "", ""];
let currentPlayer = "X";
let gameActive = true;
let gameMode = 'easy'; // Modes: 'easy', 'impossible', '2p'
let isSinglePlayer = true;
let scores = { X: 0, O: 0, Draw: 0 };

const winConditions = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
  [0, 3, 6], [1, 4, 7], [2, 5, 8], // Columns
  [0, 4, 8], [2, 4, 6]             // Diagonals
];

const cells = document.querySelectorAll('.cell');
const statusDisplay = document.getElementById('status');

// --- SET MODE ---
function setMode(mode) {
  gameMode = mode;
  isSinglePlayer = (mode !== '2p');
  
  document.getElementById('mode-easy').classList.toggle('active', mode === 'easy');
  document.getElementById('mode-imp').classList.toggle('active', mode === 'impossible');
  document.getElementById('mode-2p').classList.toggle('active', mode === '2p');
  
  // Play the requested mode sounds ONLY if not muted
  if (!isMuted) {
    if (mode === 'easy') {
      easyModeSound.currentTime = 0;
      easyModeSound.play().catch(e => console.log("Audio play blocked by browser until user interaction"));
    } else if (mode === 'impossible') {
      impModeSound.currentTime = 0;
      impModeSound.play().catch(e => console.log("Audio play blocked by browser until user interaction"));
    }
  }
  
  scores = { X: 0, O: 0, Draw: 0 };
  updateScoreboard();
  resetGame();
}

// --- HANDLE A MOVE ---
function makeMove(index) {
  if (boardData[index] !== "" || !gameActive) return;

  // Play click sound
  if (currentPlayer === "X") playTone(440, 'sine', 0.1); 
  else if (!isSinglePlayer) playTone(554, 'triangle', 0.1); 

  updateCell(index, currentPlayer);
  checkResult();

  // Trigger CPU move if playing against CPU
  if (isSinglePlayer && gameActive && currentPlayer === "O") {
    statusDisplay.textContent = "CPU is thinking...";
    setTimeout(cpuMove, 400); 
  }
}

// --- CPU LOGIC (Easy vs Impossible) ---
function cpuMove() {
  let move;

  // Easy Mode: 60% chance to make a completely random move
  if (gameMode === 'easy' && Math.random() < 0.60) {
    let emptyCells = [];
    for (let i = 0; i < 9; i++) {
      if (boardData[i] === "") emptyCells.push(i);
    }
    move = emptyCells[Math.floor(Math.random() * emptyCells.length)];
  } 
  // Impossible Mode OR the 40% of the time Easy Mode is smart
  else {
    let bestScore = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (boardData[i] === "") {
        boardData[i] = "O"; 
        let score = minimax(boardData, 0, false);
        boardData[i] = "";  
        
        if (score > bestScore) {
          bestScore = score;
          move = i;
        }
      }
    }
  }

  // Play CPU Click Sound
  playTone(330, 'square', 0.15); 
  updateCell(move, "O");
  checkResult();
}

// The Minimax Brain (Used for smart moves)
let scoresMap = { "O": 10, "X": -10, "tie": 0 };

function minimax(board, depth, isMaximizing) {
  let result = checkWinnerForAI(board);
  if (result !== null) {
    return scoresMap[result];
  }

  if (isMaximizing) {
    let bestScore = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (board[i] === "") {
        board[i] = "O";
        let score = minimax(board, depth + 1, false);
        board[i] = "";
        bestScore = Math.max(score, bestScore);
      }
    }
    return bestScore;
  } else {
    let bestScore = Infinity;
    for (let i = 0; i < 9; i++) {
      if (board[i] === "") {
        board[i] = "X";
        let score = minimax(board, depth + 1, true);
        board[i] = "";
        bestScore = Math.min(score, bestScore);
      }
    }
    return bestScore;
  }
}

function checkWinnerForAI(board) {
  for (let i = 0; i < winConditions.length; i++) {
    const [a, b, c] = winConditions[i];
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      return board[a];
    }
  }
  if (!board.includes("")) return "tie";
  return null;
}

// --- UPDATE UI FOR CELL ---
function updateCell(index, player) {
  boardData[index] = player;
  cells[index].textContent = player;
  cells[index].classList.add('taken', player.toLowerCase());
  
  currentPlayer = currentPlayer === "X" ? "O" : "X";
  
  if (gameActive) {
    statusDisplay.textContent = `Player ${currentPlayer}'s Turn`;
    statusDisplay.className = `status-bar turn-${currentPlayer.toLowerCase()}`;
  }
}

// --- CHECK WIN OR DRAW & PLAY SOUNDS ---
function checkResult() {
  let roundWon = false;
  let winningCells = [];

  for (let i = 0; i < winConditions.length; i++) {
    const [a, b, c] = winConditions[i];
    if (boardData[a] && boardData[a] === boardData[b] && boardData[a] === boardData[c]) {
      roundWon = true;
      winningCells = [a, b, c];
      break;
    }
  }

  if (roundWon) {
    let winner = currentPlayer === "X" ? "O" : "X"; 
    
    // Check if the winner is the CPU
    if (isSinglePlayer && winner === "O") {
      statusDisplay.textContent = `🤖 CPU is brilliant! You cannot beat it!`;
      statusDisplay.style.fontSize = "0.9rem"; // Shrink slightly to fit the longer text
    } else {
      statusDisplay.textContent = `🎉 Player ${winner} Wins!`;
      statusDisplay.style.fontSize = "1rem";
    }
    
    statusDisplay.className = `status-bar turn-${winner.toLowerCase()}`;
    gameActive = false;
    
    scores[winner]++;
    updateScoreboard();
    winningCells.forEach(index => cells[index].classList.add('win'));

    // --- AUDIO LOGIC ---
    if (isSinglePlayer) {
      // 1-Player Mode: Play Custom MP3s ONLY if not muted
      if (!isMuted) {
        if (winner === "X") {
          customWinSound.currentTime = 0; 
          customWinSound.play();
        } else {
          customLoseSound.currentTime = 0; 
          customLoseSound.play(); 
        }
      }
    } else {
      // 2-Player Mode: Play Retro Synth
      if (winner === "X") {
        playSequence([{f:440, t:'sine', d:0.2}, {f:554, t:'sine', d:0.2}, {f:659, t:'sine', d:0.4}]);
      } else { 
        playSequence([{f:330, t:'square', d:0.2}, {f:277, t:'square', d:0.2}, {f:220, t:'square', d:0.4}]); 
      }
    }
    return;
  }

  let roundDraw = !boardData.includes("");
  if (roundDraw) {
    statusDisplay.textContent = "😲 It's a Draw!";
    statusDisplay.style.fontSize = "1rem";
    statusDisplay.className = "status-bar";
    gameActive = false;
    scores.Draw++;
    updateScoreboard();

    // --- DRAW AUDIO LOGIC ---
    if (isSinglePlayer) {
      // 1-Player Mode: Custom Draw MP3 ONLY if not muted
      if (!isMuted) {
        customDrawSound.currentTime = 0;
        customDrawSound.play();
      }
    } else {
      // 2-Player Mode: Retro Synth Draw
      playSequence([{f:200, t:'triangle', d:0.3}, {f:200, t:'triangle', d:0.4}]);
    }
    return;
  }
}

// --- SCOREBOARD ---
function updateScoreboard() {
  document.getElementById('score-x').textContent = scores.X;
  document.getElementById('score-o').textContent = scores.O;
  document.getElementById('score-draw').textContent = scores.Draw;
}

// --- RESET GAME ---
function resetGame() {
  boardData = ["", "", "", "", "", "", "", "", ""];
  currentPlayer = "X";
  gameActive = true;
  
  statusDisplay.textContent = "Player X's Turn";
  statusDisplay.style.fontSize = "1rem";
  statusDisplay.className = "status-bar turn-x";

  cells.forEach(cell => {
    cell.textContent = "";
    cell.className = "cell"; 
  });
}
</script>
</body>
</html>
